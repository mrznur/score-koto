services:
  postgres:
    image: postgres:16-alpine
    container_name: scorekoto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scorekoto
      POSTGRES_PASSWORD: scorekoto
      POSTGRES_DB: scorekoto
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: scorekoto-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
